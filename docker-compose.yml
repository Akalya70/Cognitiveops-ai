services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cognitiveops-backend
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=CognitiveOps AI
      - DATABASE_URL=sqlite:///./cognitiveops.db
      - SECRET_KEY=change-this-secret
      - CORS_ORIGINS=http://localhost:5173
    volumes:
      - backend-data:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cognitiveops-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
